<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The roman variable file carries the whole first paint. Italic is used
         below the fold only, so it loads on demand rather than blocking. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>WarrantyPro</title>
    <meta
      name="description"
      content="Photograph a receipt once and WarrantyPro tells you before the cover runs out. Keeps the receipt, serial and dates on one record, and drafts the claim email when something breaks."
    />

    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WarrantyPro" />
    <meta property="og:title" content="WarrantyPro" />
    <meta
      property="og:description"
      content="Photograph a receipt once and WarrantyPro tells you before the cover runs out."
    />
    <meta property="og:url" content="https://warranty-pro-vert.vercel.app/" />
    <meta property="og:image" content="https://warranty-pro-vert.vercel.app/media/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://warranty-pro-vert.vercel.app/media/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WarrantyPro" />
    <meta
      name="twitter:description"
      content="Photograph a receipt once and WarrantyPro tells you before the cover runs out."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
